name: Refresh snapshot and publish

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          npm ci
          cd web && npm ci
      - name: Index the last six hours of Shannon
        env:
          RANGE_HOURS: "6"
          RPC_URL: https://dream-rpc.somnia.network
        run: node indexer/index.mjs
      - name: Build
        run: cd web && npm run build
      - name: Publish to gh-pages
        run: |
          cd web/dist
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "Praveen"
          git config user.email "171470544+soy-praveen@users.noreply.github.com"
          git add -A
          git commit -q -m "Snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
